debate.tagging.url=https://dsptest.sansad.in/debate/debate/data/create

#Endpoints for communicating with RS Section Bulletin 2 inputs for translation
section.b2.rs.url=https://dsptest.sansad.in/translation/b2-inputs/create

spring.kafka.bootstrap-servers=10.247.128.22:9092
spring.kafka.consumer.group-id=group_id
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
