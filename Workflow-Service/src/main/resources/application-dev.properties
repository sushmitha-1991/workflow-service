#Config server URL
spring.config.import=optional:configserver:https://dspuser:admin123@dsptest.sansad.in

#Server port
server.port:8087

#Log configuration
logging.level.root=INFO
service.url=https://dsptest.sansad.in/dms/openkm


#Endpoints for communicating with translation service
