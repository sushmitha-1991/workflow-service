spring.config.import=optional:configserver:http://dspuser:admin123@10.247.129.30/dsp2/rs

server.port=8080


logging.level.root=INFO

service.url=${BASE_DOMAIN_URL}/dsp2/rs/api/dms/openkm

#Endpoints for communicating with translation service
translation.input.url=${BASE_DOMAIN_URL}/dsp2/rs/api/translation/inputs/create

#Endpoints for communicating with debate service
corrected.debate.url=${BASE_DOMAIN_URL}/dsp2/rs/api/corrected/debate/lang-inputs/create

pdf.upload.url=${BASE_DOMAIN_URL}/dsp2/rs/api/template/upload-html-english

#Endpoints for communicating with debate tagging service
debate.tagging.url=${BASE_DOMAIN_URL}/dsp2/rs/api/debate/debate/data/create

#Endpoints for communicating with RS Section Bulletin 2 inputs for translation
section.b2.rs.url=${BASE_DOMAIN_URL}/dsp2/rs/api/translation/b2-inputs/create

spring.kafka.bootstrap-servers=10.247.128.22:9092
spring.kafka.consumer.group-id=group_id
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
#spring.kafka.consumer.auto-commit-interval=100 
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.topic.name=Dsp2
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

#Endpoint for communicating with notices service to fetch documents of statement of matter 377
notices.SOM377.url=${BASE_DOMAIN_URL}/dsp2/rs/api/notices/statement-of-matter/getDocuments