findAllDocumentsForUser=SELECT applicationNo, documentName, "date", LSNo, SSNo, RSSNo, status, pendingAt, refId, \
applicationId, applicationinstanceId, taskName, taskId, actionPerformed, formUrl, actionUrl \
FROM ( \
    SELECT DISTINCT ON (ai.application_no) ai.application_no AS applicationNo, \
           a.name AS documentName, ai.document_date AS date, '18' AS LSNo, 'III' AS SSNo, \
           ai.rajya_sabha_session AS RSSNo, ai.current_status AS status, \
           CASE WHEN ai.current_status = 'Approved' THEN NULL ELSE CONCAT(wh.pending_with_name) END AS pendingAt, \
           ai.ref_id AS refId, ai.application_id AS applicationId, ai.id AS applicationinstanceId, \
           'IN-PROCESS' AS taskName, wh.next_task_id AS taskId, 'True' AS actionPerformed, \
           a.form_url AS formUrl, wh.action_url AS actionUrl \
    FROM workflow.workflow_history wh \
    JOIN master.application_instance ai ON wh.application_instance_id = ai.id \
    JOIN master.applications a ON ai.application_id = a.id \
    JOIN authentication.base_user u ON u.id = wh.pending_with \
    JOIN authentication.user_roles ur ON ur.user_id = u.id AND ur.is_active = true \
    JOIN authentication.roles r ON r.id = ur.role_id \
    JOIN master.offices o ON o.id = ur.office_id \
    WHERE wh.pending_with = :userId AND wh.action_taken_by IS NULL \
    UNION \
    SELECT DISTINCT ON (ai.application_no) ai.application_no AS applicationNo, \
           a.name AS documentName, ai.document_date AS date, '18' AS LSNo, 'III' AS SSNo, \
           ai.rajya_sabha_session AS RSSNo, \
           CASE WHEN ai.current_status = 'Returned' THEN 'In Progress' ELSE ai.current_status END AS status, \
           CASE WHEN ai.current_status = 'Approved' THEN NULL ELSE CONCAT(wh.pending_with_name) END AS pendingAt, \
           ai.ref_id AS refId, ai.application_id AS applicationId, ai.id AS applicationinstanceId, \
           'IN-PROCESS' AS taskName, wh.next_task_id AS taskId, 'False' AS actionPerformed, \
           a.form_url AS formUrl, wh.action_url AS actionUrl \
    FROM workflow.workflow_history wh \
    JOIN master.application_instance ai ON wh.application_instance_id = ai.id \
    JOIN master.applications a ON ai.application_id = a.id \
    JOIN authentication.base_user u ON u.id = wh.pending_with \
    JOIN authentication.user_roles ur ON ur.user_id = u.id AND ur.is_active = true \
    JOIN authentication.roles r ON r.id = ur.role_id \
    JOIN master.offices o ON o.id = ur.office_id \
    WHERE wh.id IN ( \
        SELECT MAX(wh2.id) FROM workflow.workflow_history wh2 \
        WHERE wh2.application_instance_id IN ( \
            SELECT wh3.application_instance_id FROM workflow.workflow_history wh3 \
            WHERE wh3.pending_with IS NOT NULL AND wh3.action_taken_by = :userId \
            AND wh3.application_instance_id NOT IN ( \
                SELECT wh1.application_instance_id FROM workflow.workflow_history wh1 \
                WHERE wh1.action_taken_by IS NULL AND wh1.pending_with = :userId)) \
        GROUP BY wh2.application_instance_id) \
    UNION \
    SELECT DISTINCT ON (ii.application_no) ii.application_no AS applicationNo, \
           a.name AS documentName, ii.document_date AS date, '18' AS LSNo, 'III' AS SSNo, \
           ii.rajya_sabha_session AS RSSNo, ii.current_status AS status, \
           ii.pending_at AS pendingAt, ii.ref_id AS refId, ii.application_id AS applicationId, \
           ii.id AS applicationinstanceId, 'IN-PROCESS' AS taskName, NULL AS taskId, 'True' AS actionPerformed, \
           a.form_url AS formUrl, NULL AS actionUrl \
    FROM master.input_instance ii \
    JOIN master.applications a ON a.id = ii.application_id \
    JOIN authentication.base_user u ON u.id = ii.created_by \
    WHERE ii.created_by = :userId \
) A ORDER BY "date" DESC;
